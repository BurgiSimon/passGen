<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/lock.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f4f0" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Password generator. crypto.getRandomValues, in the browser, nothing sent anywhere."
    />
    <title>passgen</title>
    <script>
      // Pin the saved theme before first paint, otherwise a light-theme user on a
      // dark-default system sees a dark flash on every load. Vue re-applies this later.
      var m = document.cookie.match(/(^| )pg_theme=([^;]+)/)
      var t = m && decodeURIComponent(m[2])
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
